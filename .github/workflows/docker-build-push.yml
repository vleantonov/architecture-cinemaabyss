name: Docker Build and Push

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish images to GHCR (otherwise only validate builds)'
        type: boolean
        required: true
        default: false
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main ]
    paths:
      - 'src/**'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  DOCKER_METADATA_PR_HEAD_SHA: 'true'
  DOCKER_METADATA_SHORT_SHA_LENGTH: 7

jobs:
  build:
    name: Build Docker (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Fork and Dependabot PRs are built without registry credentials or publication.
      PUBLISH_IMAGES: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: monolith
            context: ./src/monolith
          - service: movies-service
            context: ./src/microservices/movies
          - service: events-service
            context: ./src/microservices/events
          - service: proxy-service
            context: ./src/microservices/proxy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The PR tag identifies the source commit, not GitHub's temporary merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          # Never infer latest from a PR or release tag.
          flavor: latest=false
          tags: |
            type=raw,value=pr-${{ github.event.number }}-{{sha}},enable=${{ github.event_name == 'pull_request' }}
            type=sha,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}

      - name: Build and optionally push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH_IMAGES == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
